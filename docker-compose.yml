services:
  postgres:
    image: postgres:16
    container_name: m2m-postgres
    environment:
      POSTGRES_DB: migration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./seeds/postgres-seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d migration"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: m2m-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-init:
    image: mongo:7
    container_name: m2m-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./seeds/mongo-init.js:/mongo-init.js:ro
    entrypoint:
      - mongosh
      - --host
      - mongo:27017
      - --quiet
      - /mongo-init.js

volumes:
  mongo_data:
